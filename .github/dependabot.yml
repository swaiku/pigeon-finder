version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "👷"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      gradle:
        patterns: ["*"]
