[tool.bumpversion]
current_version = "0.2.0"
commit = true
# The tag is created by CI when the release reaches main.
tag = false
message = "🔖 Bump version {current_version} → {new_version}"
# Run by the "Prepare release" workflow; locally it needs git-cliff installed.
# Prepend only the new section: release tags sit on main's merge commits, which
# develop does not contain, so regenerating the whole file from develop would
# merge every past release into the new one.
allow_shell_hooks = true # the hook reads $BVHOOK_NEW_VERSION
pre_commit_hooks = [
  "git cliff -c .github/cliff.toml --strip header --unreleased --tag v$BVHOOK_NEW_VERSION --prepend CHANGELOG.md",
  "git add CHANGELOG.md",
]

# Only the semantic part is bumped; the build number (+N) is set by CI.
[[tool.bumpversion.files]]
filename = "pubspec.yaml"
search = "version: {current_version}+"
replace = "version: {new_version}+"
